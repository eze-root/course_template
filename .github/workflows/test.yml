name: Test course template

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install template dependencies
        run: uv sync --frozen
      - name: Test generated projects and sudo configuration transport
        env:
          COURSE_COMPOSE_TEST_BINARY: ${{ github.workspace }}/tests/compose_cli.sh
        run: uv run python -m unittest discover -s tests -v
