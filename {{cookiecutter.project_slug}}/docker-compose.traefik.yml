services:
  course-site:
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik_default"
      - "traefik.http.routers.{{ cookiecutter.project_slug }}-http.entrypoints=web"
      - "traefik.http.routers.{{ cookiecutter.project_slug }}-http.rule=Host(`${COURSE_DOMAIN:?Set COURSE_DOMAIN}`)"
      - "traefik.http.routers.{{ cookiecutter.project_slug }}-http.middlewares={{ cookiecutter.project_slug }}-https"
      - "traefik.http.middlewares.{{ cookiecutter.project_slug }}-https.redirectscheme.scheme=https"
      - "traefik.http.middlewares.{{ cookiecutter.project_slug }}-https.redirectscheme.permanent=true"
      - "traefik.http.routers.{{ cookiecutter.project_slug }}-https.entrypoints=websecure"
      - "traefik.http.routers.{{ cookiecutter.project_slug }}-https.rule=Host(`${COURSE_DOMAIN:?Set COURSE_DOMAIN}`)"
      - "traefik.http.routers.{{ cookiecutter.project_slug }}-https.tls=true"
      - "traefik.http.routers.{{ cookiecutter.project_slug }}-https.service={{ cookiecutter.project_slug }}"
      - "traefik.http.services.{{ cookiecutter.project_slug }}.loadbalancer.server.port=80"
    networks:
      - traefik

networks:
  traefik:
    external: true
    name: traefik_default
